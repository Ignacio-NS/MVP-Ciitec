# Solo la suite de seguridad (Guia S9), contra el entorno propio y con datos
# sinteticos. Se puede correr sola (sin gastar cuota de LLM en RAG/robustez)
# cuando solo interesa validar controles de seguridad tras un cambio.
name: security
suites: [security]
default_repetitions: 1
thresholds:
  task_success_rate: 1.0
  allowed_pending_review: 0
