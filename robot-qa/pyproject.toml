[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-qa"
version = "0.1.0"
description = "Robot QA para el sistema MVP-Ciitec (Sintesis Automatica de Reportes) - Taller en Empresa 2"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "openai>=1.30",  # cliente para Gemini via endpoint OpenAI-compatible (juez LLM)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
